name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build standalone Android app
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          mkdir -p app/www
          cp index.html guide.html site.html manifest.webmanifest sw.js boot.js pdfjs-init.mjs app.css app.js engine.js rules.js jszip.min.js pdf-lib.min.js pdf.min.mjs pdf.worker.min.mjs *.png *.jpg app/www/
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/haptics@6 @capacitor/browser@6 @capacitor/app@6
          npm install @aparajita/capacitor-biometric-auth@8 || echo "Fingerprint plugin skipped"
          npm install tesseract.js@5.1.1 tesseract.js-core@5.1.1 || echo "OCR skipped"
          mkdir -p www/ocr/core www/ocr/lang
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js www/ocr/ || true
          cp node_modules/tesseract.js-core/tesseract-core* www/ocr/core/ || true
          curl -fsSL -o www/ocr/lang/eng.traineddata.gz https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz || echo "OCR language download skipped"
          echo '{"appId":"com.fileready.app","appName":"FileReady","webDir":"www","android":{"backgroundColor":"#07080c"}}' > capacitor.config.json
          npx cap add android
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp ../icon-maskable-512.png android/app/src/main/res/mipmap-$d/$f.png
            done
          done
          npx cap sync android
          cd android
          chmod +x gradlew
          sed -i "s/versionCode 1$/versionCode $GITHUB_RUN_NUMBER/; s/versionName \"1.0\"/versionName \"1.2.$GITHUB_RUN_NUMBER\"/" app/build.gradle
          ROOT=$GITHUB_WORKSPACE
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::No SIGNING_PASSWORD secret found, so this is a test (debug) build."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk $ROOT/fileready.apk
            echo "Test build (debug key). Add the SIGNING_PASSWORD secret for a signed release." > $ROOT/notes.md
          else
            ./gradlew assembleRelease
            KS=$RUNNER_TEMP/release.jks
            mkdir -p $ROOT/signing
            if [ -f $ROOT/signing/release.jks.enc ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in $ROOT/signing/release.jks.enc -out $KS -pass env:SIGNING_PASSWORD || { echo "::error::Could not unlock the signing key. Check the SIGNING_PASSWORD secret."; exit 1; }
            else
              keytool -genkeypair -keystore $KS -storetype PKCS12 -alias fileready -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Mark Joseph, O=FileReady, L=Austin, ST=Texas, C=US" -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD -noprompt
              openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in $KS -out $ROOT/signing/release.jks.enc -pass env:SIGNING_PASSWORD
              NEWKEY=1
            fi
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk $RUNNER_TEMP/aligned.apk
            $BT/apksigner sign --ks $KS --ks-key-alias fileready --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out $ROOT/fileready.apk $RUNNER_TEMP/aligned.apk
            rm -f $KS
            FP=$($BT/apksigner verify --print-certs $ROOT/fileready.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //')
            printf "Signed with the FileReady release key.\n\nCertificate SHA-256 fingerprint:\n\n\`%s\`\n\nAPK SHA-256 checksum is in fileready.apk.sha256.\n" "$FP" > $ROOT/notes.md
            if [ "$NEWKEY" = "1" ]; then
              cd $ROOT
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add signing/release.jks.enc
              git commit -m "Add encrypted release signing key"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
          cd $ROOT
          sha256sum fileready.apk > fileready.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FileReady APK
          body_path: notes.md
          files: |
            fileready.apk
            fileready.apk.sha256
