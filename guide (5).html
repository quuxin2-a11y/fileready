dden text and author names, removes them in one tap, and redacts text in Word. Scanned PDFs can be made searchable on the device with text recognition.", "b": ["Clean Word files before they go to the other side", "Text recognition runs on the device; nothing is uploaded"]}, {"t": "Compare and firm settings", "img": "guide-redline.jpg", "d": "Compare two versions of a PDF or Word file to see every added and removed word, then save a redline PDF. Export your settings as one file and share it so everyone at the firm uses the same court, rules and redaction list.", "b": ["Compare is on the Files tab", "Firm settings are under Settings"]}, {"t": "Review a filing and similar cases (Beta)", "img": "guide-review.jpg", "d": "Open Research on the home screen. Review a filing flags common mistakes in the other side's filing, or yours before you file, with options to consider and the rule. Similar cases finds court opinions on the same issues and opens them inside the app.", "b": ["Opinions open inside the app, with find-in-text and copy citation", "Information only, not legal advice: read every case before citing it"]}, {"t": "Rule packs", "img": "guide-rules.jpg", "d": "All 50 states, D.C., federal courts and the USPTO, plus data-protection flags for the EU, UK, India, Canada, Brazil, Singapore, Australia and Japan. Each pack shows what must be protected and links to the rule.", "b": ["Add your court's size limit and page size", "FileReady is not legal advice: confirm local rules and judges' orders"]}, {"t": "On your iPhone", "img": "guide-home.jpg", "d": "Open FileReady in Safari, tap Share, then Add to Home Screen. It opens full screen like an app, works offline, and keeps files on the phone. Save opens the share sheet with Save to Files.", "b": ["Android: install the signed app from the Releases page (Android 8 or newer)", "Both versions share the same features and rules"]}, {"t": "Private and secure", "img": "guide-settings.jpg", "d": "Lock the app with a PIN, choose the
