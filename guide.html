function u8(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function open(pw,quiet){try{var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(B.s),iterations:310000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(B.i)},key,u8(B.c));document.getElementById("pbody").innerHTML=new TextDecoder().decode(pt);if(window.initFirms)window.initFirms();document.getElementById("plock").style.display="none";try{sessionStorage.setItem("frpw",pw)}catch(e){}}
catch(e){if(!quiet)document.getElementById("perr").textContent=window.crypto&&crypto.subtle?"That password is not right.":"Open this page over https to unlock it."}}
document.getElementById("pgo").onclick=function(){document.getElementById("perr").textContent="Unlocking\u2026";open(document.getElementById("ppw").value.trim())};
document.getElementById("ppw").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("pgo").click()});
try{var sp=sessionStorage.getItem("frpw");if(sp)open(sp,true)}catch(e){}})();</script>

<p class="foot">FileReady checks and prepares PDFs on your device. It flags common problems and is not legal advice. Use the arrow keys or swipe to move between steps.</p></div>

var S=[{"t": "Set up your practice", "img": "guide-welcome.jpg", "d": "Pick your practice area, where you file (any state, federal court, the USPTO, or no court for deal work) and any global data-protection regions. FileReady loads the matching rule pack, each linked to its official source.", "b": ["Change it any time in Settings", "Practice areas: civil, business and deals, IP, family, injury, criminal, bankruptcy, immigration"]}, {"t": "Add your PDFs", "img": "guide-setup.jpg", "d": "Tap the glowing + button to add the lead document and exhibits from your phone. No upload: the files stay on this device. Try the court demo or the deal demo to see it work first.", "b": ["Lead documents come first, exhibits after", "Rename a filing by tapping its name"]}, {"t": "Read the check", "img": "guide-home.jpg", "d": "The ready ring and the color tiles show what needs work: orange is must fix, yellow is should fix, green passed, purple is your page count. Every issue shows the rule it comes from.", "b": ["Tap a tile to filter", "Search finds any name or number across every page"]}, {"t": "See it on the page", "img": "guide-viewer.jpg", "d": "Tap an issue to open the exact page with a glowing box around the problem, like a Social Security number or text hidden under a black box.", "b": ["Previous and Next move between pages", "Mark as reviewed if it is intentional"]}, {"t": "Fix with one tap", "img": "guide-issues.jpg", "d": "Fix removes blank pages, turns sideways pages upright, removes hidden author names and comments, and truly redacts sensitive numbers. Fix all handles every safe fix at once.", "b": ["Every fix makes a new version", "Undo any change from the Files tab"]}, {"t": "Page tools", "img": "guide-pages.jpg", "d": "Open any file's pages to turn, reorder or delete them before building.", "b": ["Tap to select pages", "Originals are never changed"]}, {"t": "Build the filing", "img": "guide-build.jpg", "d": "Choose exhibit letters, numbers or Roman numerals, then turn on cover sheets, exhibit labels, an index with Bates ranges, bookmarks, a hidden-data scrub and splitting to your court's size limit.", "b": ["Bates prefix and start number are yours to set", "One tap builds the whole filing"]}, {"t": "Filing ready", "img": "guide-built.jpg", "d": "When the build finishes you get one clean PDF, ready to share by email or save to your phone, plus a check report that lists everything that was reviewed and fixed.", "b": ["Check the built file again with one tap", "Reports carry the rule pack and date"]}, {"t": "Deal tools", "img": "guide-deal.jpg", "d": "In Business mode FileReady also checks contracts: leftover placeholders, amounts in numbers and words that differ, exhibits referenced but not attached, broken section references, blank signer names, mixed currencies and dates that read differently abroad.", "b": ["Add client or deal names to your redaction list", "IBAN, VAT, PAN and other international IDs are flagged"]}, {"t": "Signature packets and signed pages", "img": "guide-packets.jpg", "d": "Pull every signature page into one packet per signer and send it. When a signed packet comes back, add the PDF: FileReady matches each signed page to its document and puts it back in, making the executed version.", "b": ["Each packet page has a small footer so returned pages match up", "Check each match, then tap Put signed pages into documents", "Every update is a new version you can undo"]}, {"t": "Closing checklist", "img": "guide-checklist.jpg", "d": "Every document in the deal becomes a checklist item with its binder tab, who is responsible and a status. Signature counts update as signed pages come back. Add your own items, such as a wire confirmation.", "b": ["Tap a status to move it from To do to Waiting to Done", "Build binder with checklist adds it after the index", "Share the checklist as a PDF"]}, {"t": "Word files and scans", "img": "guide-word.jpg", "d": "Add Word (.docx) files too. FileReady finds tracked changes, comments, hidden text and author names, removes them in one tap, and redacts text in Word. Scanned PDFs can be made searchable on the device with text recognition.", "b": ["Clean Word files before they go to the other side", "Text recognition runs on the device; nothing is uploaded"]}, {"t": "Compare and firm settings", "img": "guide-redline.jpg", "d": "Compare two versions of a PDF or Word file to see every added and removed word, then save a redline PDF. Export your settings as one file and share it so everyone at the firm uses the same court, rules and redaction list.", "b": ["Compare is on the Files tab", "Firm settings are under Settings"]}, {"t": "Review a filing and similar cases (Beta)", "img": "guide-review.jpg", "d": "Open Research on the home screen. Review a filing flags common mistakes in the other side's filing, or yours before you file, with options to consider and the rule. Similar cases finds court opinions on the same issues and opens them inside the app.", "b": ["Opinions open inside the app, with find-in-text and copy citation", "Information only, not legal advice: read every case before citing it"]}, {"t": "Rule packs", "img": "guide-rules.jpg", "d": "All 50 states, D.C., federal courts and the USPTO, plus data-protection flags for the EU, UK, India, Canada, Brazil, Singapore, Australia and Japan. Each pack shows what must be protected and links to the rule.", "b": ["Add your court's size limit and page size", "FileReady is not legal advice: confirm local rules and judges' orders"]}, {"t": "Private and secure", "img": "guide-settings.jpg", "d": "Lock the app with a PIN, choose the animated Aurora look, light mode or larger text, and keep a firm-wide redaction list. Nothing is uploaded anywhere.", "b": ["Works offline", "Delete all data from Settings at any time"]}],i=0;
